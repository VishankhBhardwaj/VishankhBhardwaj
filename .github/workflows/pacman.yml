name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Har 12 ghante mein chalega
  workflow_dispatch: # Manual chalane ke liye
  push:
    branches:
      - main # Main branch par push karte hi chalega

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Commits se pacman animation banana
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark

      # 2. SVG files ko 'output' branch pe push karna
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
